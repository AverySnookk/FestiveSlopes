; Festive Slopes settings (AverySnookk Studios). Edit, then restart the game, or run the "reload" command.
; true/false for switches. Distances in metres.

[General]
; Master switch. false = the mod loads nothing at all.
enabled = true
; Extra detail in FestiveSlopes.log (placement decisions, timings once a minute).
debug_logging = false
; Ctrl+Alt+F show/hide decorations, Ctrl+Alt+G regenerate, Ctrl+Alt+J info (written to FestiveSlopes.log).
keybinds_enabled = true

[Decorations]
; How festive the resort gets: off, light, moderate, festive, wonderland (Christmas Wonderland).
;   light      = a few of the resort's own trees dressed with lights along some trails and by buildings
;   moderate   = more dressed trees along most trails, occasional gingerbread houses (default)
;   festive    = dressed trees along every trail but one, more houses, a few two-house groups
;   wonderland = the edges of every trail but one glowing, the most houses
; The mod never adds trees: it decorates trees the game already placed (healthy evergreens only).
density = moderate
; Multiplier for how many of the resort's trees get decorated (0 = none, 1 = normal, up to 3).
tree_frequency = 1.0
; Multiplier for the chance of gingerbread houses (0 = none, 1 = normal, up to 3).
house_frequency = 1.0
; Hard limit on decorations for the whole resort (keeps very large resorts fast).
max_decorations = 1500
; Glowing Christmas lights, stars and house windows. false = ornaments only and dark windows.
holiday_lighting = true
; Brightness of the glowing lights (0.2 - 4).
light_brightness = 1.0

[Placement]
; 0 = decorations follow the resort (the same resort always looks the same). Any other number gives another layout.
placement_seed = 0
; How far outside the edge of a trail's skiable corridor decorations start.
trail_edge_offset_m = 3
; Steepest ground (degrees) a gingerbread house may stand on.
max_house_slope_deg = 18
; Keep this far from buildings and from lift stations (lift towers, cable lines and small props such as
; lights, benches and terrain-park features are always avoided by a short fixed distance).
building_clearance_m = 22
lift_clearance_m = 14
; Keep this far from walkways saved in the resort's save file.
walkway_clearance_m = 5
; Trails shorter than this are never decorated.
min_trail_length_m = 80
; Watch for new trails/buildings/lifts and update the decorations (unchanged areas stay as they are).
auto_update = true
update_interval_seconds = 30
; Remember placements per resort in the Cache folder (faster loading; deleted safely at any time).
use_cache = true
