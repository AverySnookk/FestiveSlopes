Name = Festive Slopes
Author = AverySnookk Studios
Description = Christmas comes to your resort: decorated Christmas trees with glowing lights and gingerbread houses along the edges of selected ski trails. Standalone and cosmetic: nothing is saved into your resort.
Usage = Decorations start appearing near the camera about 10 s after a resort loads (15-30 s on the first visit to a resort). Ctrl+Alt+F shows/hides them, Ctrl+Alt+G regenerates. Density and more in Config\FestiveSlopes.ini.
